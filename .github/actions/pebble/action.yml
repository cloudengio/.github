name: pebble
description: "set up Pebble environment"
inputs:
  pebble-version:
    description: "pebble version to set up"
    default: "v2.8.0"
  minica-version:
    description: "minica version to set up"
    default: "v1.1.0"
runs:
  using: "composite"
  steps:
    - name: install pebble and minica
      shell: bash
      env:
        PEBBLE_VERSION: ${{ inputs.pebble-version }}
        MINICA_VERSION: ${{ inputs.minica-version }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_ENVIRONMENT}" == "self-hosted" ]]; then
          # pebble and minica are prebaked into the runner image (see
          # github-runners/macos/scripts/10-pebble-minica.sh). Select the
          # requested version and add it to PATH; error if it was not baked in.
          tools_root=/opt/gha-tools

          pebble_dir="${tools_root}/pebble/${PEBBLE_VERSION}"
          if [[ ! -x "${pebble_dir}/pebble" ]]; then
            echo "::error::pebble ${PEBBLE_VERSION} is not preinstalled in this runner image (available: $(ls "${tools_root}/pebble" 2>/dev/null | tr '\n' ' '))" >&2
            exit 1
          fi
          echo "${pebble_dir}" >> "${GITHUB_PATH}"

          minica_dir="${tools_root}/minica/${MINICA_VERSION}"
          if [[ ! -x "${minica_dir}/minica" ]]; then
            echo "::error::minica ${MINICA_VERSION} is not preinstalled in this runner image (available: $(ls "${tools_root}/minica" 2>/dev/null | tr '\n' ' '))" >&2
            exit 1
          fi
          echo "${minica_dir}" >> "${GITHUB_PATH}"
        else
          go install "github.com/letsencrypt/pebble/v2/cmd/pebble@${PEBBLE_VERSION}"
          go install "github.com/jsha/minica@${MINICA_VERSION}"
        fi

    - name: init pebble hosts Windows
      # Use PowerShell (the default shell on Windows runners)
      if: ${{ runner.os == 'Windows' && runner.environment != 'self-hosted' }}
      shell: pwsh
      run: |
        Add-Content -Path $env:WINDIR\System32\drivers\etc\hosts -Value "127.0.0.1 pebble.example.com pebble-test.example.com"
        Get-Content -Path $env:WINDIR\System32\drivers\etc\hosts

    - name: init pebble hosts Linux or macOS
      if: ${{ (runner.os == 'Linux' || runner.os == 'macOS') && runner.environment != 'self-hosted' }}
      shell: bash
      run: |
        if grep -q "pebble.example.com" /etc/hosts; then
          # can't use sudo on locally hosted runners, we must be
          # preconfigured with this entry
          echo "pebble.example.com already exists in /etc/hosts"
        else
          echo "127.0.0.1 pebble.example.com pebble-test.example.com" | sudo tee -a /etc/hosts
          cat /etc/hosts
        fi

    - name: test pebble hosts on Linux or macOS
      shell: bash
      if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
      run: |
        ping -c 2 pebble-test.example.com
        ping -c 2 pebble.example.com

    - name: test pebble hosts on Windows
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        ping -n 2 pebble-test.example.com
        ping -n 2 pebble.example.com
