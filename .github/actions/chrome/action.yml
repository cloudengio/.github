name: chrome
description: "set up Chrome environment"
outputs:
  chrome-path:
    description: "Path to the chrome executable"
    value: ${{ steps.setup-chrome.outputs.chrome-path }}
  chrome-user-data-dir:
    description: "Path to the chrome user data directory"
    value: ${{ steps.setup-chrome.outputs.chrome-user-data-dir }}
runs:
  using: "composite"
  steps:
    - name: set up chrome for testing
      shell: bash
      id: setup-chrome
      run: |
        set -euo pipefail
        # Chrome for Testing has no linux/arm64 build (Google only publishes
        # linux64/x64). There is nothing to install or resolve on such hosts, so
        # skip cleanly without setting outputs. Consumers gate on runner.os/arch.
        if [[ "${RUNNER_OS}" == "Linux" && "${RUNNER_ARCH}" == "ARM64" ]]; then
          echo "::notice::Chrome for Testing has no linux/arm64 build; skipping Chrome setup."
          exit 0
        fi
        if [[ runner.environment == "self-hosted" ]]; then
          # Chrome for Testing is preinstalled in the runner image (see
          # github-runners/macos/scripts/09-chrome-for-testing.sh). Resolve the
          # install paths from the same code that installed them instead of
          # downloading. `paths` contacts no network, verifies the binary is
          # present, and writes chrome-path and chrome-user-data-dir to
          # $GITHUB_OUTPUT. The platform/arch is detected automatically.
          chrome-for-testing paths --channel=stable --application=chrome
        else
          go install cloudeng.io/citools/chrome-for-testing@latest
          # chrome-for-testing writes chrome-path and chrome-user-data-dir to $GITHUB_OUTPUT
          chrome-for-testing install --channel=stable --application=chrome --initialize
        fi
